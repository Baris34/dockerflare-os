# Included in the http context by the unprivileged nginx image.
map $http_upgrade $workshop_connection {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Callback URLs may contain single-use tickets.
    access_log off;

    location = /healthz {
        return 200 "ok\n";
    }

    location ~ ^/(api|gatekeeper|blueprint-screenshot)(/|$) {
        # nginx upstream errors include the full request URI, which can hold an OAuth code.
        error_log /dev/null;
        # Resolve at request time so replacing workshop does not require restarting web.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $workshop workshop:8787;
        proxy_pass http://$workshop$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Workshop-External-Https https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $workshop_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 0;
    }

    location ~ ^/assets/.*\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location ~ ^/(assets/|icons/|pdfjs/|[^/]+\.[^/]+$) {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
